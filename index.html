<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Bookstore</title>

    <link rel="shortcut icon" href="./assets/icons/book.svg" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variables.css">

    <script src="./scripts/database.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>

</head>

<body onload="init()">
    <header>
        <div class="headline">
            <img src="./assets/icons/book-white.svg" alt="book icon">
            <h1>Small Bookstore</h1>
            <button onclick="openLikedBooksDialog()"><img src="./assets/icons/heart-white.svg"
                    alt="heart icon for liked list"></button>
        </div>
    </header>
    <main>
        <article id="book-container"></article>

        <dialog id="liked-books-dialog" onclick="closeLikedBooksDialog()">
            <div class="dialog-content" onclick="stopBubbling(event)">
                <h2>Gelikte Bücher</h2>
                <div id="liked-books-list-container"></div>
                <button onclick="closeLikedBooksDialog()">close</button>
            </div>
        </dialog>
    </main>
</body>

</html>
